<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Poke Date</title>
</head>
<body>
    <main>
        <section>
            <article>
                <img src="./img/pokemons/Pikachu_(Star)-ROSA.png" alt="poke-profile" class="poke">
    
                <div>
                    <div>
                        <h1>Rosa</h1>
                        <p class="loc">Cascade des Turtos</p>
                    </div>
                    <p class="age">18</p>
                </div>
            </article>
            
            <div class="actions">
                <div class="cross">
                    <img src="./img/cross.svg" alt="cross">
                </div>
                <div class="heart">
                    <img src="./img/heart.svg" alt="heart">
                </div>
            </div>
        </section>
    </main>

    <footer>
        Poke-Date ~ &copy; Luis DS
    </footer>
</body>
</html>
